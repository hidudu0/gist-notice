<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIST 학사공지 알림</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학사공지">
<style>
  /* -----------------------------------------------------------
     토큰
     브랜드는 라이트/다크에서 같은 네이비 계열을 유지한다 (hue 220).
     밝기만 올려서 어두운 배경에서도 흰 글씨가 AA 를 넘게 한다.
     ----------------------------------------------------------- */
  :root {
    --bg:#f7f8fa; --card:#fff; --ink:#1a2a4a; --muted:#5b6478;
    --line:#e3e6ec; --brand:#1a2a4a; --accent:#ff7a45;
    --ok:#1a7a48; --bad:#c0392b;

    /* 모서리: 컨테이너 / 컨트롤 / 알약. 이 셋 말고는 쓰지 않는다. */
    --r-card:14px; --r-control:12px; --r-pill:999px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161f; --card:#1a1f2b; --ink:#eef1f6; --muted:#9aa4b8;
            --line:#2a3140; --brand:#3457a8;
            --ok:#4cc38a; --bad:#f07171; }
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
         "Pretendard", "Malgun Gothic", sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap { max-width:620px; margin:0 auto; padding:24px 18px 48px; }

  /* 키보드 사용자에게만 보이는 포커스 링. 액센트 색은 이 한 곳에만 쓴다. */
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  header { display:flex; align-items:center; gap:12px; margin-bottom:24px; }

  /* 게시판 바로가기. 아이콘만 두면 눌러도 되는지 알 수 없어서 문구를 붙인다.
     터치 영역은 최소 44px 를 넘긴다. */
  .board {
    margin-left:auto; flex:none;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    min-width:44px; padding:3px 4px; color:var(--muted); text-decoration:none;
    font-size:10.5px; font-weight:500; line-height:1.25; text-align:center;
    border-radius:var(--r-control);
    transition:background-color .18s ease, color .18s ease, transform .1s ease;
  }
  .board img { width:34px; height:34px; border-radius:9px; display:block; }
  .board:hover { background:var(--card); color:var(--ink); }
  .board:active { transform:translateY(1px); }
  h1 { font-size:19px; margin:0; letter-spacing:-.02em; }
  .sub { color:var(--muted); font-size:13px; margin:2px 0 0; }

  .panel {
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
    padding:18px; margin-bottom:22px;
  }

  /* 섹션 라벨. 한글에는 uppercase 가 안 먹고 넓은 자간은 읽기만 나빠진다. */
  h2 {
    font-size:13px; font-weight:600; color:var(--muted);
    margin:0 0 14px; letter-spacing:0;
  }
  .lead { font-size:16px; font-weight:600; margin:0 0 12px; }
  .hint { color:var(--muted); font-size:12.5px; margin:0 0 12px; }

  /* -----------------------------------------------------------
     컨트롤
     터치 대상은 최소 44px. :active 에 1px 눌림을 줘서 눌린 느낌을 만든다.
     ----------------------------------------------------------- */
  button {
    width:100%; min-height:48px; padding:14px; font-size:16px; font-weight:600;
    font-family:inherit; border:0; border-radius:var(--r-control);
    background:var(--brand); color:#fff; cursor:pointer;
    transition:background-color .18s ease, border-color .18s ease,
               opacity .18s ease, transform .1s ease;
  }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled { opacity:.45; cursor:default; }
  button.off {
    background:transparent; color:var(--ink); border:1px solid var(--line);
  }
  button.off:hover { border-color:var(--muted); }
  /* 보조 액션. 테두리를 빼서 위의 주 버튼과 무게를 벌린다. */
  button.ghost {
    background:transparent; color:var(--muted); border:0;
    min-height:44px; padding:10px; font-size:14px; font-weight:500; margin-top:4px;
  }
  button.ghost:hover { color:var(--ink); }
  button + .msg { margin-top:14px; }

  .msg { font-size:13px; color:var(--muted); text-align:center; }
  .msg.bad { color:var(--bad); }
  .msg.good { color:var(--ok); }

  ol.steps { margin:0; padding-left:20px; color:var(--muted); }
  ol.steps li { margin:8px 0; }
  ol.steps b { color:var(--ink); }

  /* -----------------------------------------------------------
     칩
     필터 칩과 목록의 카테고리 태그가 같은 모양을 쓴다.
     알약 하나만 쓰고 각진 배지는 만들지 않는다.
     ----------------------------------------------------------- */
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .chips input { position:absolute; opacity:0; pointer-events:none; }
  .chips span {
    display:flex; align-items:center; min-height:40px; padding:0 15px;
    border-radius:var(--r-pill); border:1px solid var(--line);
    font-size:14px; color:var(--muted); cursor:pointer; user-select:none;
    transition:background-color .18s ease, border-color .18s ease,
               color .18s ease, transform .1s ease;
  }
  .chips span:active { transform:translateY(1px); }
  .chips input:checked + span {
    background:var(--brand); border-color:var(--brand); color:#fff; font-weight:500;
  }
  .chips input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }

  .count {
    display:flex; align-items:center; gap:10px;
    color:var(--muted); font-size:12.5px; margin:0 0 4px; min-height:22px;
  }
  .reset {
    width:auto; min-height:0; padding:0; margin:0;
    background:none; border:0; color:var(--muted);
    font-size:12.5px; font-weight:500; text-decoration:underline; cursor:pointer;
  }
  .reset:hover { color:var(--ink); }
  input[type=text], input[type=search] {
    width:100%; min-height:48px; padding:13px; font-size:15px; font-family:inherit;
    border:1px solid var(--line); border-radius:var(--r-control);
    background:var(--card); color:var(--ink); margin-bottom:12px;
  }
  input[type=search]::-webkit-search-cancel-button { cursor:pointer; }
  input[type=text]::placeholder, input[type=search]::placeholder { color:var(--muted); opacity:1; }

  /* -----------------------------------------------------------
     공지 목록
     카드 대신 헤어라인으로 나눈다. 제목이 화면의 주인공이라
     제목만 잉크색·중간 굵기고 나머지는 눌러둔다.
     ----------------------------------------------------------- */
  a.item {
    display:block; padding:14px 12px; margin:0 -12px;
    border-radius:var(--r-control); color:inherit; text-decoration:none;
    transition:background-color .18s ease, transform .1s ease;
  }
  a.item + a.item { border-top:1px solid var(--line); border-radius:0 0 var(--r-control) var(--r-control); }
  a.item:hover { background:var(--card); }
  a.item:active { transform:translateY(1px); }
  a.item .t { font-size:16px; font-weight:500; line-height:1.45; letter-spacing:-.01em; }
  a.item .m {
    display:flex; align-items:center; gap:8px;
    color:var(--muted); font-size:12.5px; margin-top:5px;
  }
  .tag {
    display:inline-block; padding:2px 9px; border-radius:var(--r-pill);
    border:1px solid var(--line); font-size:11.5px; line-height:1.5;
  }

  /* -----------------------------------------------------------
     당겨서 새로고침
     화면 맨 위에서 아래로 끌면 목록을 다시 받아온다.
     ----------------------------------------------------------- */
  /* 브라우저가 제 새로고침을 같이 걸어버리면 두 번 당겨진다. 막는다. */
  body { overscroll-behavior-y:contain; }
  #ptr {
    position:fixed; left:0; right:0; top:env(safe-area-inset-top); height:56px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; transform:translateY(-56px);
    transition:transform .25s ease, opacity .25s ease;
  }
  /* 끄는 중에는 손가락을 바로 따라가야 한다. 전환을 끈다. */
  #ptr.drag { transition:none; }
  #ptr .ring {
    width:24px; height:24px; border-radius:50%;
    border:2px solid var(--line); border-top-color:var(--brand);
  }
  #ptr.spin .ring { animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; }
    button:active, .chips span:active, a.item:active { transform:none; }
  }
</style>
</head>
<body>

<div id="ptr" aria-hidden="true"><div class="ring"></div></div>

<div class="wrap">

  <header>
    <div>
      <h1>GIST 학사공지 알림</h1>
      <div class="sub" id="tagline">새 공지가 올라오면 폰으로 알려드립니다</div>
    </div>
    <a class="board" target="_blank" rel="noopener"
       href="https://www.gist.ac.kr/kr/html/sub05/050209.html">
      <img src="/icon-192.png" alt="">
      <span>학사공지<br>바로가기</span>
    </a>
  </header>

  <div class="panel" id="panel">
    <div class="msg">확인 중…</div>
  </div>

  <h2>공지 찾기</h2>
  <input type="search" id="q" placeholder="제목 검색" autocomplete="off"
    enterkeyhint="search" aria-label="공지 제목 검색">
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div id="list"><div class="msg">불러오는 중…</div></div>

</div>

<script>
// ===========================================================
//  구독 화면
//
//  하는 일:
//    1. OS 를 보고 알맞은 화면을 보여준다
//       - iOS 인데 홈 화면에 추가 안 했으면 → 설치 안내
//         (iOS 는 사파리 탭에서는 푸시가 아예 안 온다. 16.4+ 부터,
//          홈 화면에 추가한 상태에서만 동작한다)
//       - 그 외(안드로이드, 데스크톱)  → 알림 켜기 버튼
//    2. 버튼을 누르면 구독을 만들어 서버에 보낸다
//    3. 받아온 공지 목록을 카테고리·검색어로 걸러서 보여준다
// ===========================================================

const panel = document.getElementById('panel');
const listEl = document.getElementById('list');
const chipsEl = document.getElementById('chips');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');
const tagline = document.getElementById('tagline');

// 홈 화면(또는 설치된 앱)에서 실행 중인가?
const standalone =
  window.navigator.standalone === true ||
  window.matchMedia('(display-mode: standalone)').matches;

const isIOS =
  /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS

const supported = 'serviceWorker' in navigator && 'PushManager' in window;

// 관리자 등록: 주소 끝에 #admin=<토큰> 을 붙여 한 번 열면 이 기기가
// 장애 알림을 받는다. 해시(#)는 서버로도 외부 링크로도 새어나가지 않는다.
const adminMatch = location.hash.match(/^#admin=(.+)$/);
if (adminMatch) {
  localStorage.setItem('adminToken', decodeURIComponent(adminMatch[1]));
  history.replaceState(null, '', location.pathname);
}
const adminHeaders = () => {
  const t = localStorage.getItem('adminToken');
  return t ? { 'x-admin-token': t } : {};
};

// 서버가 주는 VAPID 공개키는 base64url 문자열인데,
// pushManager.subscribe 는 바이트 배열을 요구한다. 그래서 변환한다.
function toBytes(base64url) {
  const b64 = (base64url + '='.repeat((4 - (base64url.length % 4)) % 4))
    .replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(b64);
  return Uint8Array.from(raw, (ch) => ch.charCodeAt(0));
}

function render(html) { panel.innerHTML = html; }
function say(text, kind = '') {
  const el = document.getElementById('msg');
  if (el) { el.textContent = text; el.className = 'msg ' + kind; }
}

const postJson = (path, body, extra = {}) =>
  fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', ...extra },
    body: JSON.stringify(body),
  });

// 현재 이 기기의 구독 객체. 없으면 null.
async function currentSub() {
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

// -----------------------------------------------------------
//  화면 결정
// -----------------------------------------------------------
async function start() {
  if (isIOS && !standalone) {
    render(`
      <p class="lead">먼저 홈 화면에 추가해 주세요</p>
      <ol class="steps">
        <li>아래 <b>공유 버튼</b>(⬆️ 네모에 화살표)을 누르고</li>
        <li><b>홈 화면에 추가</b>를 선택한 뒤</li>
        <li>홈 화면에 생긴 <b>아이콘으로 다시 열어</b>주세요</li>
      </ol>
      <div class="msg">아이폰은 사파리 탭에서는 알림을 받을 수 없습니다.
        홈 화면에 추가해야만 동작합니다. (iOS 16.4 이상)</div>
    `);
    return;
  }

  if (!supported) {
    render(`<div class="msg bad">이 브라우저는 웹 푸시를 지원하지 않습니다.
      Chrome 또는 Safari 최신 버전에서 열어주세요.</div>`);
    return;
  }

  if (Notification.permission === 'denied') {
    render(`<div class="msg bad">알림이 차단되어 있습니다.
      브라우저 설정에서 이 사이트의 알림을 허용으로 바꿔주세요.</div>`);
    return;
  }

  // 이미 구독돼 있으면 끄기 버튼을 보여준다
  const reg = await navigator.serviceWorker.register('/sw.js');
  const existing = await reg.pushManager.getSubscription();
  showButton(Boolean(existing));

  // 살아 있다는 신호. 서버가 이 구독의 만료 시한을 다시 180일로 민다.
  // 앱을 지운 기기는 이 요청을 못 보내므로 KV 가 알아서 정리한다.
  // 화면을 막을 이유가 없어서 기다리지 않고, 실패해도 조용히 넘긴다.
  if (existing) {
    postJson('/api/subscribe', existing.toJSON(), adminHeaders()).catch(() => {});
  }
}

function showButton(subscribed) {
  render(`
    <button id="btn" class="${subscribed ? 'off' : ''}">
      ${subscribed ? '알림 끄기' : '알림 켜기'}
    </button>
    ${subscribed ? '<button id="test" class="ghost">테스트 알림 보내기</button>' : ''}
    <div class="msg" id="msg">${subscribed ? '새 공지가 오면 알려드릴게요' : ''}</div>
  `);
  document.getElementById('btn').onclick = subscribed ? unsubscribe : subscribe;
  if (subscribed) document.getElementById('test').onclick = sendTest;
}

// -----------------------------------------------------------
//  구독하기
//
//  ★ 권한 요청은 반드시 이 클릭 핸들러 안에서 일어나야 한다.
//    페이지가 열리자마자 requestPermission 을 부르면 브라우저가 무시한다.
// -----------------------------------------------------------
async function subscribe() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  say('알림 권한을 확인하는 중…');

  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      btn.disabled = false;
      say('알림이 허용되지 않았습니다', 'bad');
      return;
    }

    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;

    const { key } = await (await fetch('/api/vapid')).json();

    // 폰이 FCM/APNs 에 가서 이 기기 전용 주소(endpoint)를 발급받아 온다
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,            // 조용한 푸시는 안 쓴다는 약속 (필수)
      applicationServerKey: toBytes(key),
    });

    const res = await postJson('/api/subscribe', sub.toJSON(), adminHeaders());
    if (!res.ok) throw new Error('서버 등록 실패 ' + res.status);

    showButton(true);
    say('알림이 켜졌습니다', 'good');
    loadMeta();
  } catch (err) {
    btn.disabled = false;
    say('실패: ' + err.message, 'bad');
    console.error(err);
  }
}

async function unsubscribe() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  try {
    const sub = await currentSub();
    if (sub) {
      await postJson('/api/unsubscribe', sub.toJSON());
      await sub.unsubscribe();
    }
    showButton(false);
    say('알림을 껐습니다');
    loadMeta();
  } catch (err) {
    btn.disabled = false;
    say('실패: ' + err.message, 'bad');
  }
}

// 알림이 실제로 오는지 지금 확인한다. 안 그러면 다음 공지가 올라올 때까지
// 며칠을 기다려야 켜진 게 맞는지 알 수 없다 — iOS 는 특히 잘 깨진다.
async function sendTest() {
  const btn = document.getElementById('test');
  btn.disabled = true;
  say('보내는 중…');
  try {
    const sub = await currentSub();
    if (!sub) throw new Error('구독 정보가 없습니다');
    const res = await postJson('/api/test', sub.toJSON());
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    say('보냈습니다. 잠시 뒤 알림이 오는지 확인하세요', 'good');
  } catch (err) {
    say('실패: ' + err.message, 'bad');
  }
  btn.disabled = false;
}

// -----------------------------------------------------------
//  공지 찾기
//
//  거르기는 전부 브라우저에서 한다. 목록은 이미 통째로 받아왔고
//  수백 건 수준이라 서버를 한 번 더 부를 이유가 없다.
// -----------------------------------------------------------
let items = [];      // 서버에서 받은 전체 목록
let picked = [];     // 선택한 카테고리. 비었으면 전체

// 검색어가 없을 때 목록을 통째로 그리면 스크롤만 길어진다.
const PREVIEW = 20;

function visible() {
  const q = qEl.value.trim().toLowerCase();
  return items.filter(
    (c) =>
      (picked.length === 0 || picked.includes(c.category)) &&
      (q === '' || c.title.toLowerCase().includes(q)),
  );
}

function renderList() {
  const hits = visible();
  const narrowed = picked.length > 0 || qEl.value.trim() !== '';

  if (hits.length === 0) {
    countEl.textContent = '';
    listEl.innerHTML = `<div class="msg">${
      items.length === 0
        ? '아직 불러온 공지가 없습니다. 첫 확인이 끝나면 여기에 표시됩니다.'
        : '조건에 맞는 공지가 없습니다'
    }</div>`;
    return;
  }

  // 좁혀 봤을 때는 결과를 다 보여준다. 그냥 둘러보는 중이면 앞부분만.
  const shown = narrowed ? hits : hits.slice(0, PREVIEW);
  countEl.innerHTML = narrowed
    ? `${hits.length}건 <button class="reset" id="reset">초기화</button>`
    : shown.length === items.length
      ? `전체 ${items.length}건`
      : `전체 ${items.length}건 중 최근 ${shown.length}건`;
  if (narrowed) document.getElementById('reset').onclick = reset;

  listEl.innerHTML = shown
    .map(
      (c) => `
      <a class="item" target="_blank" rel="noopener"
         href="https://www.gist.ac.kr/kr/html/sub05/050209.html?mode=V&no=${c.no}">
        <div class="t">${escapeHtml(c.title)}</div>
        <div class="m"><span class="tag">${escapeHtml(c.category)}</span>${c.date}</div>
      </a>`,
    )
    .join('');
}

// 칩을 하나씩 다시 누르지 않아도 되게 한 번에 푼다.
function reset() {
  qEl.value = '';
  chipsEl.querySelectorAll('input:checked').forEach((i) => { i.checked = false; });
  picked = [];
  renderList();
}

function renderChips(categories) {
  chipsEl.innerHTML = categories
    .map(
      (c) => `<label><input type="checkbox" value="${escapeHtml(c)}"><span>${escapeHtml(c)}</span></label>`,
    )
    .join('');
  chipsEl.onchange = () => {
    picked = [...chipsEl.querySelectorAll('input:checked')].map((i) => i.value);
    renderList();
  };
}

qEl.oninput = renderList;

// -----------------------------------------------------------
//  구독자 수 · 최근 공지 목록
// -----------------------------------------------------------
async function loadMeta() {
  try {
    const { subs, categories } = await (await fetch('/api/meta')).json();
    if (subs > 0) tagline.textContent = `${subs}명이 구독 중입니다`;
    if (categories.length) renderChips(categories);
  } catch { /* 칩이 없어도 검색창은 동작한다 */ }
}

async function loadList() {
  try {
    items = await (await fetch('/api/latest')).json();
    renderList();
  } catch {
    listEl.innerHTML = `<div class="msg bad">목록을 불러오지 못했습니다</div>`;
  }
}

// 공지 제목은 남이 쓴 글이다. 그대로 innerHTML 에 넣으면 안 된다.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// -----------------------------------------------------------
//  당겨서 새로고침
//
//  맨 위에서 아래로 끌면 목록과 구독자 수를 다시 받아온다.
//  서버는 KV 에 있는 값을 돌려줄 뿐 게시판을 새로 긁지는 않는다 —
//  그건 30분마다 도는 크론 몫이고, 아무나 시키게 두면 GIST 서버를
//  우리 이름으로 계속 두드리게 된다.
// -----------------------------------------------------------
const ptr = document.getElementById('ptr');
const TRIGGER = 64;   // 이만큼 끌어야 새로고침이 걸린다
const MAX = 90;       // 더 끌어도 여기까지만 내려온다

let startY = null;    // 끌기 시작한 지점. null 이면 끄는 중이 아니다
let pulled = 0;       // 지금까지 끌린 거리(px)
let busy = false;     // 새로고침 중에는 다시 안 걸리게

function ptrAt(y) {
  ptr.style.transform = `translateY(${y - 56}px)`;
  ptr.style.opacity = String(Math.min(1, y / TRIGGER));
}

addEventListener('touchstart', (e) => {
  // 맨 위가 아니면 그냥 스크롤이다. 손가락 두 개는 확대/축소라 건드리지 않는다.
  if (busy || window.scrollY > 0 || e.touches.length !== 1) return;
  startY = e.touches[0].clientY;
  pulled = 0;
  ptr.classList.add('drag');
}, { passive: true });

addEventListener('touchmove', (e) => {
  if (startY === null) return;
  const dy = e.touches[0].clientY - startY;

  // 위로 올리는 중이면 평범한 스크롤이다. 넘긴다.
  if (dy <= 0) { endPull(false); return; }

  // 손가락을 그대로 따라가면 스치기만 해도 걸린다. 저항을 준다.
  pulled = Math.min(MAX, dy / 2.2);
  ptrAt(pulled);
  e.preventDefault(); // 고무줄 스크롤과 겹치지 않게
}, { passive: false });

addEventListener('touchend', () => { if (startY !== null) endPull(pulled >= TRIGGER); });
addEventListener('touchcancel', () => { if (startY !== null) endPull(false); });

async function endPull(go) {
  startY = null;
  ptr.classList.remove('drag');
  if (!go) { ptrAt(0); return; }

  busy = true;
  ptr.classList.add('spin');
  ptrAt(56);
  try {
    await Promise.all([loadMeta(), loadList()]);
  } finally {
    ptr.classList.remove('spin');
    ptrAt(0);
    busy = false;
  }
}

start();
loadMeta();
loadList();
</script>
</body>
